<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>piLoading – PV-Überschussladen</title>
<style>
  :root {
    --bg: #0f1420;
    --card-bg: #1a2233;
    --border: #2a3550;
    --text: #e6ebf5;
    --text-dim: #8b96ad;
    --green: #4caf7d;
    --red: #e0654f;
    --amber: #d9a441;
    --blue: #5b8def;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 1.5rem;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  h1 { font-size: 1.3rem; font-weight: 600; margin: 0; }
  #lang-btn {
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.4rem 0.8rem;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #lang-btn:hover { border-color: var(--blue); }
  #banner {
    display: none;
    background: var(--amber);
    color: #1a1300;
    padding: 0.6rem 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
    font-weight: 600;
  }
  #night-banner {
    display: none;
    background: var(--blue);
    color: #0a1120;
    padding: 0.6rem 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
    font-weight: 600;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1rem;
  }
  .card .label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }
  .card .value { font-size: 1.4rem; font-weight: 600; margin-top: 0.2rem; }
  .card .sub { font-size: 0.8rem; color: var(--text-dim); margin-top: 0.15rem; }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .blue { color: var(--blue); }
  #reason {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    margin-bottom: 1.5rem;
    font-size: 0.95rem;
  }
  #chart-wrap {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
  }
  #chart-wrap .legend { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.5rem; }
  .legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 0.3rem; }
  canvas { width: 100%; height: 260px; display: block; }
  footer { margin-top: 1rem; font-size: 0.75rem; color: var(--text-dim); }
</style>
</head>
<body>
  <header>
    <h1 id="title">piLoading – PV-Überschussladen</h1>
    <button id="lang-btn" type="button" title="">English</button>
  </header>
  <div id="banner"></div>
  <div id="night-banner"></div>

  <div class="cards">
    <div class="card">
      <div class="label" data-i18n="grid_label">Netz</div>
      <div class="value" id="grid-power">–</div>
      <div class="sub" data-i18n="grid_sub">positiv = Bezug, negativ = Überschuss</div>
    </div>
    <div class="card">
      <div class="label" data-i18n="pv_label">PV-Leistung</div>
      <div class="value" id="pv-power">–</div>
    </div>
    <div class="card">
      <div class="label" data-i18n="battery_label">Batterie</div>
      <div class="value" id="battery-soc">–</div>
      <div class="sub" id="battery-power"></div>
    </div>
    <div class="card">
      <div class="label" data-i18n="wallbox_label">Wallbox</div>
      <div class="value" id="wallbox-power">–</div>
      <div class="sub" id="wallbox-detail"></div>
    </div>
  </div>

  <div id="reason">
    <div class="label" style="color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase;" data-i18n="decision_label">Entscheidung</div>
    <div id="reason-text">–</div>
  </div>

  <div id="chart-wrap">
    <div class="legend">
      <span class="swatch" style="background: var(--blue);"></span><span data-i18n="legend_net">Netz (W)</span>
      <span class="swatch" style="background: var(--green);"></span><span data-i18n="legend_wallbox">Wallbox (W)</span>
      &nbsp;·&nbsp;<span data-i18n="legend_period">letzte 24h</span>
    </div>
    <canvas id="chart" width="1000" height="260"></canvas>
  </div>

  <footer id="updated">–</footer>

<script>
// --- localization ---------------------------------------------------------
// Strings come from static/locales/<lang>.json. Adding a new language is just a
// matter of dropping a <lang>.json file there; the button then picks it up.
let LANG = "en";
let CATALOG = {};

function t(key, vars) {
  let s = CATALOG[key] || key;
  if (vars) {
    for (const [k, v] of Object.entries(vars)) {
      s = s.replace(new RegExp("\\{" + k + "\\}", "g"), v);
    }
  }
  return s;
}

function localeTag() { return LANG === "en" ? "en-GB" : LANG === "de" ? "de-DE" : LANG; }

async function loadCatalog(lang) {
  const res = await fetch("/locales/" + encodeURIComponent(lang) + ".json");
  if (!res.ok) throw new Error(`locale ${lang}: HTTP ${res.status}`);
  CATALOG = await res.json();
}

function applyLanguage() {
  document.documentElement.lang = LANG;
  document.title = t("title");
  document.getElementById("title").textContent = t("title");
  document.getElementById("lang-btn").textContent = LANG === "en" ? "Deutsch" : "English";
  document.getElementById("lang-btn").title = t("title");
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t(el.dataset.i18n);
  });
  refreshStatus();
}

async function initLanguage() {
  try {
    const res = await fetch("/api/lang");
    const data = await res.json();
    LANG = data.lang || "en";
  } catch (e) {
    LANG = "en";
  }
  await loadCatalog(LANG);
  applyLanguage();
}

async function switchLanguage() {
  const next = LANG === "en" ? "de" : "en";
  // Persist to .env (so it survives a restart) and switch live.
  const res = await fetch("/api/lang", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ lang: next }),
  });
  if (!res.ok) return;
  LANG = next;
  await loadCatalog(LANG);
  applyLanguage();
}
// --------------------------------------------------------------------------

const fmtW = (w) => w === null || w === undefined ? "–" : Math.round(w).toLocaleString(localeTag()) + " W";
const fmtA = (a) => a === null || a === undefined ? "–" : a.toFixed(1) + " %";

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  return res.json();
}

function setText(id, text, cls) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = el.className.replace(/\b(green|red|blue)\b/g, "").trim();
  if (cls) el.classList.add(cls);
}

async function refreshStatus() {
  let s;
  try {
    s = await fetchJSON("/api/status");
  } catch (e) {
    setText("reason-text", t("conn_lost"));
    return;
  }

  const banner = document.getElementById("banner");
  if (s.stale) {
    banner.style.display = "block";
    banner.textContent = t("stale_banner");
  } else {
    banner.style.display = "none";
  }

  const nightBanner = document.getElementById("night-banner");
  if (s.decision && s.decision.night_mode) {
    nightBanner.style.display = "block";
    nightBanner.textContent = t("night_banner");
  } else {
    nightBanner.style.display = "none";
  }

  if (s.grid) {
    const gp = s.grid.grid_power_w;
    setText("grid-power", fmtW(gp), gp > 0 ? "red" : "green");
    setText("pv-power", fmtW(s.grid.pv_power_w));
    if (s.grid.battery_soc_pct !== null && s.grid.battery_soc_pct !== undefined) {
      setText("battery-soc", fmtA(s.grid.battery_soc_pct));
      setText("battery-power", fmtW(s.grid.battery_power_w));
    }
  }

  if (s.wallbox) {
    setText("wallbox-power", fmtW(s.wallbox.power_w), s.wallbox.charging ? "green" : null);
    const phaseDetail = t("phase_detail", { phases: s.wallbox.phases });
    let detail = `${phaseDetail} · ${s.wallbox.amps_effective} A · ${s.wallbox.car_state}`;
    if (s.wallbox.error) {
      const err = s.wallbox.error_key ? t(s.wallbox.error_key) : s.wallbox.error;
      detail = `${detail} · ${t("error_detail", { error: err })}`;
    }
    setText("wallbox-detail", detail);
  }

  if (s.decision) {
    const reason = s.decision.reason_key
      ? t(s.decision.reason_key, s.decision.reason_vars)
      : s.decision.reason;
    setText("reason-text", reason);
  }

  const updatedEl = document.getElementById("updated");
  updatedEl.textContent = s.updated_at
    ? t("updated_prefix") + " " + new Date(s.updated_at).toLocaleTimeString(localeTag())
    : "–";
}

function drawChart(canvas, samples) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (samples.length < 2) return;

  const values = samples.flatMap(s => [s.grid_power_w ?? 0, s.wallbox_power_w ?? 0]);
  const minV = Math.min(0, ...values), maxV = Math.max(0, ...values);
  const range = maxV - minV || 1;
  const t0 = samples[0].ts, t1 = samples[samples.length - 1].ts;
  const tRange = (t1 - t0) || 1;

  const x = (ts) => ((ts - t0) / tRange) * (w - 20) + 10;
  const y = (v) => h - 10 - ((v - minV) / range) * (h - 20);

  // zero line
  ctx.strokeStyle = "#2a3550";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, y(0));
  ctx.lineTo(w, y(0));
  ctx.stroke();

  const drawSeries = (key, color) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    samples.forEach((s, i) => {
      const v = s[key] ?? 0;
      i === 0 ? ctx.moveTo(x(s.ts), y(v)) : ctx.lineTo(x(s.ts), y(v));
    });
    ctx.stroke();
  };

  drawSeries("grid_power_w", "#5b8def");
  drawSeries("wallbox_power_w", "#4caf7d");
}

async function refreshHistory() {
  let rows;
  try {
    rows = await fetchJSON("/api/history?hours=24");
  } catch (e) {
    return;
  }
  drawChart(document.getElementById("chart"), rows);
}

document.getElementById("lang-btn").addEventListener("click", switchLanguage);

initLanguage().then(() => {
  refreshStatus();
  refreshHistory();
});
setInterval(refreshStatus, 5000);
setInterval(refreshHistory, 60000);
</script>
</body>
</html>
